<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Picker</title>
<meta name="description" content="__TITLE__">
<style>
:root{--bg:#f6f6f4;--panel:#ffffff;--ink:#1c1c1a;--muted:#6b6b66;--line:#e2e2dd;--accent:#0f6e5c;--accent-ink:#ffffff;--bad:#b3261e;--warn:#8a5a00;--ok:#1d6b35;--tag:#e8a400}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--panel:#1e1e1c;--ink:#ecece8;--muted:#9a9a93;--line:#33332f;--accent:#3fb39b;--accent-ink:#0b1a16;--bad:#ff8a80;--warn:#e0b24a;--ok:#6fcf8a;--tag:#ffc83d}}
:root[data-theme="dark"]{--bg:#151514;--panel:#1e1e1c;--ink:#ecece8;--muted:#9a9a93;--line:#33332f;--accent:#3fb39b;--accent-ink:#0b1a16;--bad:#ff8a80;--warn:#e0b24a;--ok:#6fcf8a;--tag:#ffc83d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:15px;margin:0 8px 0 0;font-weight:600;max-width:40ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;min-height:32px}
button:hover{border-color:var(--muted)}
button[aria-pressed="true"],button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab small{color:var(--muted);margin-left:4px}.tab.on small{color:inherit;opacity:.8}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.dot.pass{background:var(--ok)}.dot.fail{background:var(--bad)}.dot.warn{background:var(--warn)}
.group{display:flex;gap:4px}
main{display:grid;grid-template-columns:1fr 300px;min-height:calc(100vh - 50px)}
.stage{overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.frame{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:width .15s}
iframe{display:block;border:0;width:100%;height:calc(100vh - 90px)}
aside{border-left:1px solid var(--line);background:var(--panel);padding:12px 16px;overflow:auto;max-height:calc(100vh - 50px);position:sticky;top:50px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
aside h2:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.ev{color:var(--muted);font-size:12px;margin:0 0 6px}
textarea{width:100%;min-height:72px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
.tagitem{display:flex;gap:6px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line)}
.tagitem code{font-size:11px;color:var(--muted);word-break:break-all}
.tagitem input{flex:1;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.send{width:100%;margin-top:8px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.status{font-size:12px;color:var(--muted);min-height:1.4em}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:860px){.tabs{flex:0 0 100%}.tab small{display:none}main{grid-template-columns:1fr}aside{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}iframe{height:75vh}h1{max-width:100%;flex-basis:100%}}
</style>
</head>
<body>
<script type="application/json" id="data">__DATA__</script>
<header>
  <h1 id="title"></h1>
  <div class="tabs" id="tabs" role="tablist" aria-label="Options"></div>
  <div class="group" role="group" aria-label="Device">
    <button data-dev="phone">Phone</button><button data-dev="tablet">Tablet</button><button data-dev="desktop">Desktop</button><button data-dev="slide">Slide</button>
  </div>
  <div class="group">
    <button id="tagBtn" aria-pressed="false" title="Click parts of the option to graft them">Tag part</button>
    <button id="baseBtn">Use as base</button>
  </div>
</header>
<main>
  <section class="stage"><div class="frame" id="frame"><iframe id="view" title="Option preview"></iframe></div></section>
  <aside>
    <h2>Option</h2><div id="meta"></div>
    <h2>Gates</h2><div id="gates"></div>
    <h2>Scores</h2><div id="scores"></div>
    <h2>Notes on this option</h2><textarea id="notes" placeholder="What works, what doesn't"></textarea>
    <h2>Pick</h2>
    <div id="pick"></div>
    <button class="send primary" id="sendBtn">Send to agent</button>
    <button class="send" id="copyBtn">Copy pick</button>
    <div class="status" id="status" aria-live="polite"></div>
    <p class="hint">Keys 1-9 and arrows switch options. Tag part, then click inside the preview.</p>
  </aside>
</main>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'design-picker-' + D.slug;
const SERVED = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
const WIDTHS = {phone: 393, tablet: 834, desktop: null, slide: null};
let S = {base: null, tags: [], notes: {}, dev: 'desktop'};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let cur = Math.max(0, D.options.findIndex((o) => o.name === new URLSearchParams(location.search).get('v')));
let tagging = false;
$('title').textContent = D.title;

function gateClass(g) { return !g ? '' : g.status === 'pass' ? 'pass' : g.status === 'fail' ? 'fail' : 'warn'; }
function renderTabs() {
  $('tabs').innerHTML = D.options.map((o, i) =>
    `<button role="tab" class="tab${i === cur ? ' on' : ''}" aria-selected="${i === cur}" data-i="${i}"><span class="dot ${gateClass(o.gates)}"></span>${i + 1}. ${esc(o.name)}${S.base === o.name ? ' ★' : ''}<small>${esc(o.axis)}</small></button>`).join('');
  $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => show(+b.dataset.i));
}
function cssPath(el) {
  const parts = [];
  while (el && el.nodeType === 1 && el.tagName !== 'BODY' && parts.length < 6) {
    if (el.id) { parts.unshift('#' + el.id); break; }
    let p = el.tagName.toLowerCase();
    const cls = [...el.classList].filter((c) => !c.startsWith('design-')).slice(0, 2);
    if (cls.length) p += '.' + cls.join('.');
    const sib = el.parentElement ? [...el.parentElement.children].filter((c) => c.tagName === el.tagName) : [];
    if (sib.length > 1) p += `:nth-of-type(${sib.indexOf(el) + 1})`;
    parts.unshift(p); el = el.parentElement;
  }
  return parts.join(' > ');
}
function wireFrame() {
  const doc = $('view').contentDocument; if (!doc) return;
  const st = doc.createElement('style');
  st.textContent = '.design-hover{outline:2px dashed var(--design-tag,#e8a400)!important;outline-offset:2px;cursor:crosshair}.design-tagged{outline:2px solid #e8a400!important;outline-offset:2px}';
  doc.head && doc.head.appendChild(st);
  const o = D.options[cur];
  S.tags.filter((t) => t.option === o.name).forEach((t) => { try { doc.querySelector(t.selector)?.classList.add('design-tagged'); } catch (e) {} });
  doc.addEventListener('mouseover', (e) => { if (tagging && !e.target.closest('[data-design-dev]')) e.target.classList.add('design-hover'); });
  doc.addEventListener('mouseout', (e) => e.target.classList?.remove('design-hover'));
  doc.addEventListener('click', (e) => {
    if (!tagging || e.target.closest('[data-design-dev]')) return;
    e.preventDefault(); e.stopPropagation();
    e.target.classList.remove('design-hover'); e.target.classList.add('design-tagged');
    S.tags.push({option: o.name, selector: cssPath(e.target), text: (e.target.innerText || '').trim().slice(0, 60), note: ''});
    save(); renderPick();
  }, true);
  doc.addEventListener('keydown', onKey);
}
function sizeFrame() {
  const w = WIDTHS[S.dev], f = $('frame'), v = $('view');
  document.querySelectorAll('[data-dev]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.dev === S.dev));
  v.style.transform = ''; v.style.transformOrigin = '0 0';
  if (S.dev === 'slide') {
    const avail = $('frame').parentElement.clientWidth - 32, k = Math.min(1, avail / 1920);
    f.style.width = Math.round(1920 * k) + 'px'; v.style.width = '1920px'; v.style.height = '1080px';
    v.style.transform = `scale(${k})`; f.style.height = Math.round(1080 * k) + 'px';
  } else { f.style.width = w ? w + 'px' : '100%'; f.style.height = ''; v.style.width = '100%'; v.style.height = ''; }
}
function show(i) {
  S.notes[D.options[cur].name] = $('notes').value;
  cur = (i + D.options.length) % D.options.length;
  const o = D.options[cur];
  history.replaceState(null, '', '?v=' + encodeURIComponent(o.name));
  $('view').onload = wireFrame; $('view').srcdoc = o.html;
  $('meta').innerHTML = `<div class="row"><b>${esc(o.name)}</b><span>${esc(o.axis || 'no axis meta')}</span></div>`;
  const g = o.gates;
  $('gates').innerHTML = !g ? '<p class="ev">Not run</p>' : Object.entries(g.checks || {}).map(([k, v]) =>
    `<div class="row"><span><span class="dot ${v.status === 'pass' ? 'pass' : v.status === 'fail' ? 'fail' : 'warn'}"></span>${esc(k)}</span><span>${esc(v.status)}</span></div>${v.detail ? `<p class="ev">${esc(v.detail)}</p>` : ''}`).join('');
  const sc = o.scores;
  $('scores').innerHTML = !sc ? '<p class="ev">Not scored</p>' : Object.entries(sc).map(([k, v]) =>
    `<div class="row"><span>${esc(k)}</span><b>${esc(v.score)}</b></div><p class="ev">${esc(v.evidence)}</p>`).join('');
  $('notes').value = S.notes[o.name] || '';
  $('baseBtn').textContent = S.base === o.name ? 'Base ★' : 'Use as base';
  renderTabs(); sizeFrame(); renderPick(); save();
}
function pickLine() {
  if (!S.base) return '';
  const grafts = S.tags.filter((t) => t.option !== S.base).map((t) => `+"${t.selector}" from ${t.option}${t.note ? ` (${t.note})` : ''}`);
  const keep = S.tags.filter((t) => t.option === S.base).map((t) => `keep "${t.selector}"${t.note ? ` (${t.note})` : ''}`);
  return `mash ${S.base} ${[...grafts, ...keep].join(' ')}`.trim();
}
function pickData() {
  S.notes[D.options[cur].name] = $('notes').value;
  return {line: pickLine() || '(no base picked yet)', base: S.base, tags: S.tags, notes: Object.fromEntries(Object.entries(S.notes).filter(([, v]) => v.trim()))};
}
function renderPick() {
  const rows = S.tags.map((t, i) => `<div class="tagitem"><span>${esc(t.option)}</span><code>${esc(t.selector)}</code><input aria-label="Note for tag" data-i="${i}" value="${esc(t.note)}" placeholder="note"><button data-x="${i}" aria-label="Remove tag">×</button></div>`).join('');
  $('pick').innerHTML = `<p class="ev">${S.base ? 'Base: <b>' + esc(S.base) + '</b>' : 'No base yet'}</p>${rows || '<p class="ev">No tagged parts</p>'}`;
  $('pick').querySelectorAll('input').forEach((inp) => inp.oninput = () => { S.tags[+inp.dataset.i].note = inp.value; save(); });
  $('pick').querySelectorAll('[data-x]').forEach((b) => b.onclick = () => { S.tags.splice(+b.dataset.x, 1); save(); show(cur); });
}
function onKey(e) {
  if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key >= '1' && e.key <= '9' && +e.key <= D.options.length) show(+e.key - 1);
  else if (e.key === 'ArrowRight') show(cur + 1);
  else if (e.key === 'ArrowLeft') show(cur - 1);
}
document.addEventListener('keydown', onKey);
document.querySelectorAll('[data-dev]').forEach((b) => b.onclick = () => { S.dev = b.dataset.dev; save(); sizeFrame(); });
$('tagBtn').onclick = () => { tagging = !tagging; $('tagBtn').setAttribute('aria-pressed', tagging); };
$('baseBtn').onclick = () => { S.base = D.options[cur].name; save(); show(cur); };
$('notes').oninput = () => { S.notes[D.options[cur].name] = $('notes').value; save(); };
$('copyBtn').onclick = async () => {
  const d = pickData(), text = d.line + '\n' + JSON.stringify(d);
  try { await navigator.clipboard.writeText(text); $('status').textContent = 'Copied. Paste it into the chat.'; }
  catch (e) { $('status').innerHTML = '<textarea readonly aria-label="Pick to copy"></textarea>'; const t = $('status').firstChild; t.value = text; t.select(); }
};
$('sendBtn').onclick = async () => {
  if (!SERVED) { $('copyBtn').click(); return; }
  try {
    const r = await fetch('/send', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(pickData())});
    const j = await r.json(); $('status').textContent = `Sent (#${j.seq}). The agent is on it.`;
  } catch (e) { $('status').textContent = 'Send failed: ' + e.message + '. Use Copy pick.'; }
};
if (!SERVED) $('sendBtn').textContent = 'Copy pick for the agent';
if (!SERVED) $('copyBtn').hidden = true;
window.addEventListener('resize', sizeFrame);
show(cur);
</script>
</body>
</html>
